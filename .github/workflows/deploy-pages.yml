# Skeleton: Blazor WASM → Cloudflare Pages at /ygocalc (MieHelper may finish wiring).
# Requires secrets: CLOUDFLARE_API_TOKEN
name: Deploy Pages (ygocalc skeleton)

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish Blazor WASM
        run: |
          set -euo pipefail
          dotnet publish YGOProbabilityCalculatorBlazor/YGOProbabilityCalculatorBlazor.csproj \
            -c Release -o publish-out
          # Pages project root; base href /ygocalc/ may need csproj <BaseHref> later
          ls -la publish-out/wwwroot | head
      - name: Upload to Cloudflare Pages (skeleton)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ab2343f4691dfe98689e375fc23d4121
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN missing; skeleton dry-run only"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy publish-out/wwwroot \
            --project-name=ygocalc \
            --branch=main
