# Blazor WASM → Cloudflare Worker assets at tools.xm1221.cn/ygocalc
name: Deploy ygocalc

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "YGOProbabilityCalculatorBlazor/**"
      - "deploy/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish Blazor WASM
        run: |
          set -euo pipefail
          dotnet publish YGOProbabilityCalculatorBlazor/YGOProbabilityCalculatorBlazor.csproj \
            -c Release -o publish-out \
            -p:BlazorWasmPrerendering=disable
          rm -rf deploy/wwwroot
          mkdir -p deploy/wwwroot
          cp -a publish-out/wwwroot/. deploy/wwwroot/
          ls -la deploy/wwwroot | head
      - name: Deploy Worker
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ab2343f4691dfe98689e375fc23d4121
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN missing"
            exit 1
          fi
          npx --yes wrangler@4 deploy
